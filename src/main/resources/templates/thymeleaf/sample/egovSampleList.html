<!--/* 게시판 목록 화면 */-->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title th:text="#{title.sample}"></title>

	<!--/* KRDS 스타일 */-->
	<link rel="stylesheet" type="text/css" th:href="@{/css/component/output.css}"/>
	<link rel="stylesheet" type="text/css" th:href="@{/css/egovframe.css}"/>
	<script th:inline="javascript" th:src="@{/js/jquery.min.js}"></script>
	<script th:inline="javascript" th:src="@{/js/egovframework/common.js}" defer></script>
	<script th:inline="javascript" defer>
		function sampleSearch() {
            if (notNullCheck($('#searchKeyword').val())) {
				$('#pageIndex').val(1);
				$('#listForm').attr('method', 'post').attr('action', [[@{/egovSampleList.do}]]).submit();
            } else {
            	alert(/*[[#{search.error}]]*/'검색어를 입력해주세요.');
            }
		}

		function samplePagination(pageIndex) {
        	$('#pageIndex').val(pageIndex);
        	$('#listForm').attr('method', 'post').attr('action', [[@{/egovSampleList.do}]]).submit();
        }

        function sampleCreate() {
        	$('#id').val(null);
        	$('#listForm').attr('method', 'post').attr('action', [[@{/addSampleView.do}]]).submit();
        }

        function sampleDetail(id) {
            $('#id').val(id);
            $('#listForm').attr('method', 'post').attr('action', [[@{/updateSampleView.do}]]).submit();
        }
    </script>
</head>

<body>
<div id="container" class="inner">

	<!--/* 타이틀 */-->
	<h2 class="heading-large" th:text="#{list.sample}"></h2>

	<div id="content_pop">
		<form id="listForm" th:object="${sampleVO}">
			<input type="hidden" th:id="id" th:name="id" />
			<input type="hidden" th:id="pageIndex" th:name="pageIndex" th:value="${sampleVO.pageIndex}" />
			<input type="hidden" th:field="*{pageSize}" />

			<!--/* 검색 */-->
			<div class="form-group">
				<div class="search-wrap">
					<div class="search-body">
						<div class="form-conts searchOption">
							<select id="searchCondition" name="searchCondition" class="krds-form-select medium" th:title="#{search.choose}">
								<option th:text="Name" th:value="1" th:selected="${sampleVO.searchCondition} == 1"></option>
								<option th:text="ID" th:value="0" th:selected="${sampleVO.searchCondition} == 0"></option>
							</select>
						</div>
						<div class="form-conts btn-ico-wrap searchKeyword">
							<input type="text" id="searchKeyword" name="searchKeyword" th:value="${sampleVO.searchKeyword}" class="krds-input medium" th:placeholder="#{search.keyword}">
							<button type="button" class="krds-btn medium icon" th:onclick="sampleSearch()">
								<span class="sr-only" th:text="#{button.search}"></span>
								<i class="svg-icon ico-sch"></i>
							</button>
						</div>
					</div>
					<div class="page-btn-wrap">
						<label for="pageUnit" class="sr-only" th:text="#{page.unit.label}"></label>
						<select th:field="*{pageUnit}" class="krds-form-select medium page-unit-select" onchange="samplePagination(1)">
							<option th:if="${!#lists.contains({5, 10, 20, 50, 100}, sampleVO.pageUnit)}"
								th:value="${sampleVO.pageUnit}" th:text="#{page.unit.option(${sampleVO.pageUnit})}"></option>
							<option th:each="unit : ${ {5, 10, 20, 50, 100} }" th:value="${unit}" th:text="#{page.unit.option(${unit})}"></option>
						</select>
						<button type="button" class="krds-btn medium" th:text="#{button.create}" th:onclick="sampleCreate()"></button>
					</div>
				</div>
			</div>
		</form>

		<!--/* 목록 */-->
		<p class="search-result-count" role="status" th:utext="#{search.result.count(${paginationInfo.totalRecordCount})}"></p>
		<!--/* KRDS 구조화 목록(표형) : PC 화면 */-->
		<div class="krds-structured-list-table sample-list-table" th:unless="${resultList == null or resultList.isEmpty()}">
			<div class="krds-table-wrap">
				<table class="tbl col data">
					<caption th:text="#{title.sample.caption}"></caption>
					<colgroup>
						<col style="width: 8%;">
						<col style="width: 16%;">
						<col style="width: 22%;">
						<col>
						<col style="width: 10%;">
						<col style="width: 12%;">
					</colgroup>
					<thead>
						<tr>
							<th scope="col">No</th>
							<th scope="col" th:text="#{title.sample.id}"></th>
							<th scope="col" th:text="#{title.sample.name}"></th>
							<th scope="col" th:text="#{title.sample.description}"></th>
							<th scope="col" th:text="#{title.sample.useYn}"></th>
							<th scope="col" th:text="#{title.sample.regUser}"></th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="result, iterStat : ${resultList}">
							<td class="list-no" th:text="${paginationInfo.totalRecordCount + 1 - ((sampleVO.pageIndex - 1) * sampleVO.recordCountPerPage + iterStat.count)}"></td>
							<td th:text="${result.id}"></td>
							<td class="text-left"><a href="#" th:onclick="sampleDetail([[${result.id}]])" th:text="${result.name}"></a></td>
							<td class="text-left" th:text="${result.description}"></td>
							<td>
								<span th:if="${result.useYn == 'Y'}" th:text="#{input.yes}"></span>
								<span th:if="${result.useYn == 'N'}" th:text="#{input.no}"></span>
							</td>
							<td th:text="${result.regUser}"></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
		<!--/* KRDS 구조화 목록(기본) : 모바일 화면 */-->
		<ul class="krds-structured-list type-full sample-list" th:unless="${resultList == null or resultList.isEmpty()}">
			<li class="structured-item" th:each="result, iterStat : ${resultList}">
				<div class="in">
					<div class="card-top">
						<span class="list-no"><span class="sr-only">No</span><span th:text="${paginationInfo.totalRecordCount + 1 - ((sampleVO.pageIndex - 1) * sampleVO.recordCountPerPage + iterStat.count)}"></span></span>
					</div>
					<div class="card-body">
						<a href="#" class="c-text" th:onclick="sampleDetail([[${result.id}]])">
							<p class="c-date">
								<strong class="key" th:text="#{title.sample.id}"></strong>
								<span class="value" th:text="${result.id}"></span>
							</p>
							<p class="c-tit"><span class="span" th:text="${result.name}"></span></p>
							<p class="c-txt" th:text="${result.description}"></p>
							<p class="c-date">
								<strong class="key" th:text="#{title.sample.useYn}"></strong>
								<span class="value">
									<span th:if="${result.useYn == 'Y'}" th:text="#{input.yes}"></span>
									<span th:if="${result.useYn == 'N'}" th:text="#{input.no}"></span>
								</span>
							</p>
							<p class="c-date">
								<strong class="key" th:text="#{title.sample.regUser}"></strong>
								<span class="value" th:text="${result.regUser}"></span>
							</p>
						</a>
					</div>
				</div>
			</li>
		</ul>
		<p class="sample-list-empty" th:if="${resultList == null or resultList.isEmpty()}" th:text="#{info.nodata.msg}"></p>

		<!--/* 페이지네이션 */-->
		<div id="paging" class="krds-pagination w-page" th:utext="${#egovKrdsPaginationRenderer.renderPagination(paginationInfo, 'samplePagination')}"></div>

	</div>

</div>

</body>
</html>
