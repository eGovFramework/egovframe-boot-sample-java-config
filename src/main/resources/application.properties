spring.application.name=egovframe-boot-sample
server.port=8080

# Actuator : health \uB9CC \uB178\uCD9C (Docker HEALTHCHECK \u00B7 k8s probe)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# \uC124\uC815 \uD074\uB798\uC2A4\uC758 Bean \uC774 \uC790\uB3D9 \uAD6C\uC131 Bean \uC744 \uB36E\uC5B4\uC4F0\uB3C4\uB85D \uD5C8\uC6A9
spring.main.allow-bean-definition-overriding=true

# OSIV \uBE44\uD65C\uC131\uD654 : \uD2B8\uB79C\uC7AD\uC158 \uC885\uB8CC \uC2DC \uC601\uC18D\uC131 \uCEE8\uD14D\uC2A4\uD2B8 \uC885\uB8CC
spring.jpa.open-in-view=false

# \uC138\uC158 \uCD94\uC801\uC740 \uCFE0\uD0A4\uB9CC \uC0AC\uC6A9 (URL \uC5D0 ;jsessionid= \uBBF8\uB178\uCD9C, \uB9AC\uB2E4\uC774\uB809\uD2B8 URL "/" \uC720\uC9C0)
server.servlet.session.tracking-modes=cookie

# \uC138\uC158 \uCFE0\uD0A4 : HttpOnly, SameSite=Lax
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Secure : TLS \uB97C \uD504\uB85D\uC2DC(\uB85C\uB4DC\uBC38\uB7F0\uC11C)\uC5D0\uC11C \uC885\uB8CC\uD558\uB294 \uC6B4\uC601 \uD658\uACBD\uC740 SESSION_COOKIE_SECURE=true \uB85C \uAE30\uB3D9
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# \uB85C\uADF8 \uB808\uBCA8 : \uC6B4\uC601 INFO (SQL \uD30C\uB77C\uBBF8\uD130 \uBBF8\uAE30\uB85D), \uAC1C\uBC1C \uC2DC --logging.level.egovframework=DEBUG
logging.level.egovframework=INFO
logging.level.org.egovframe=INFO
