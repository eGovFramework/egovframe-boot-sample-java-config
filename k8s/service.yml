apiVersion: v1
kind: Service
metadata:
  name: egovframe-boot-sample
  labels:
    app.kubernetes.io/name: egovframe-boot-sample
    app.kubernetes.io/part-of: egovframe-sample
spec:
  # 로컬 클러스터(minikube / Docker Desktop / kind) 접속용 NodePort
  type: NodePort
  selector:
    app.kubernetes.io/name: egovframe-boot-sample
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
